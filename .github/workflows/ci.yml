name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: qingshui_media_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/qingshui_media_ci
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare CI test environment
        run: |
          pnpm drizzle-kit push --force
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const db = await mysql.createConnection({
            host: "127.0.0.1",
            port: 3306,
            user: "root",
            password: "ci-root-password",
            database: "qingshui_media_ci",
          });
          await db.execute(
            "INSERT INTO users (openId, username, name, role, isActive, isFounder) VALUES (?, ?, ?, 'admin', 1, 1) ON DUPLICATE KEY UPDATE isFounder = 1, role = 'admin', isActive = 1",
            ["ci-founder", "Chaney", "CI Founder"],
          );
          await db.end();
          NODE
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core
          sudo mkdir -p /home/ubuntu
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/ubuntu/qingshui-media-equipment
      - run: pnpm check
      - run: pnpm test -- --no-file-parallelism
      - run: pnpm build
